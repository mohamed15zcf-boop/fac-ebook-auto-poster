name: Run Grok Chat

on:
  workflow_dispatch: # يسمح لك بتشغيله يدوياً بضغطة زر

jobs:
  chat:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run script
      env:
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }} # تمرير المفتاح بأمان
      run: python chat.py
